[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "taplite4mpo"
version = "0.3.0"
description = "Open C++ static traffic-assignment kernel (GMNS) for MPO/DOT models, with a Python QA/orchestration layer (dtalite_qa) and a kernel driver (pytaplite)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "ASU Trans-AI Lab" },                # TODO: set maintainer name + email before release
]
keywords = [
  "traffic-assignment", "transportation", "user-equilibrium", "frank-wolfe",
  "gmns", "dtalite", "taplite", "mpo", "travel-demand-model", "vdf", "qvdf",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = []          # core is stdlib-only; the C++ kernel is compiled in / shipped

[project.optional-dependencies]
data = ["pandas"]                      # pytaplite Result.to_pandas
science = ["numpy", "scipy"]           # super-zone encoders + skim recovery
gis = ["pyshp", "pandas", "pyogrio", "geopandas", "pyarrow"]  # Network Adapter GIS round trip (CR-0013)
runconfig = ["pyyaml"]                 # `taplite run <config.yml>` (falls back to a stdlib parser)
all = ["pandas", "numpy", "scipy", "pyshp", "pyyaml", "pyogrio", "geopandas", "pyarrow"]

[project.urls]
Homepage = "https://github.com/asu-trans-ai-lab/TAPLite4MPO"
Repository = "https://github.com/asu-trans-ai-lab/TAPLite4MPO"
Documentation = "https://github.com/asu-trans-ai-lab/TAPLite4MPO/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/asu-trans-ai-lab/TAPLite4MPO/issues"

[project.scripts]
dtalite-qa = "dtalite_qa.__main__:main"
taplite = "dtalite_qa.taplite_cli:main"

[tool.setuptools]
packages = ["dtalite_qa", "pytaplite", "taplite4mpo"]
# ext_modules (the pybind11 _native binding) are declared in setup.py so the build can fall
# back gracefully when no C++ compiler is present (pytaplite then uses subprocess).

[tool.setuptools.package-data]
dtalite_qa = ["templates/*.yml", "selfdemo_data/*.json", "selfdemo_data/*/*"]

[tool.cibuildwheel]
# cp38 dropped: Python 3.8 is EOL (Oct 2024) and its macOS wheels default to the
# macosx_10_9 platform tag, which a C++17 extension cannot satisfy -- delocate-wheel
# rejected the cp38 repaired wheel in CI on the v0.2.0 tag. 3.8 users still get the sdist.
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_i686 *_i686 pp*"
build-verbosity = 1
test-command = "python -c \"from pytaplite import _native; before = _native.openmp_status(0); probe = _native.openmp_status(2); after = _native.openmp_status(0); print(before, probe, after); assert probe['compiled']; assert probe['probe_team_size'] >= min(2, probe['num_procs']); assert before['max_threads'] == after['max_threads']; assert before['dynamic'] == after['dynamic']\""

[tool.cibuildwheel.macos]
# Published arm64 wheels support macOS 13 and newer. The native extension and the pinned
# llvm-openmp runtime must both satisfy this target before delocate repairs the wheel.
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }
