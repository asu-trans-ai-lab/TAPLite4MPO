name: build-and-test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    # The kernel uses MSVC-secure CRT calls (fopen_s/scanf_s), so it builds on
    # Windows (MSVC has them natively; MinGW also works locally via build.sh).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure (CMake + MSVC)
        run: cmake -S kernel -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build kernel (DTALite_exe)
        run: cmake --build build --config Release --target DTALite_exe

      - name: Stage executable -> bin/TAPLite.exe (+ legacy DTALite.exe copy)
        shell: bash
        run: |
          mkdir -p bin
          cp build/Release/DTALite_exe.exe bin/TAPLite.exe
          cp build/Release/DTALite_exe.exe bin/DTALite.exe
          ls -la bin/

      - name: Native OpenMP processor tests
        env:
          TAPLITE_REQUIRE_OPENMP: "1"
        run: |
          python -m pip install pybind11
          python setup.py build_ext --inplace
          python -m unittest tests.test_openmp_native -v

      - name: Regression suite
        run: python test_networks/run_regression.py

      # The release gate: every public-network QA/QC gate must pass (kernel,
      # regression, synthetic sparse-id repro, ARC intake/VDF + smoke run,
      # NVTA public-safe path, pytaplite APIs). One self-checking command --
      # the same script a human runs before tagging a release.
      - name: Release smoke test (public QA/QC gates)
        run: |
          python -m pip install pandas numpy pyshp
          python scripts/release_smoke.py
