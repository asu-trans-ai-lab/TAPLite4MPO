name: build-wheels

# Build binary wheels for Windows / Linux / macOS + an sdist, and (on a version tag)
# publish to PyPI via Trusted Publishing. Manual run: Actions -> build-wheels -> Run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "setup.py"
      - "pyproject.toml"
      - "kernel/**"
      - "scripts/verify_macos_wheel.py"
      - "tests/test_openmp_native.py"
      - "tests/test_verify_macos_wheel.py"
      - ".github/actions/setup-macos-libomp/**"
      - ".github/workflows/wheels.yml"

jobs:
  wheels:
    name: wheels on ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned macOS OpenMP runtime
        if: runner.os == 'macOS'
        id: libomp
        uses: ./.github/actions/setup-macos-libomp
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_ARCHS_MACOS: "native"
          CIBW_ENVIRONMENT: "TAPLITE_REQUIRE_OPENMP=1"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=13.0 TAPLITE_REQUIRE_OPENMP=1 LIBOMP_PREFIX=${{ steps.libomp.outputs.prefix }}"
      - name: Verify repaired macOS wheels
        if: runner.os == 'macOS'
        run: |
          python -m pip install delocate
          delocate-listdeps wheelhouse/*.whl
          python scripts/verify_macos_wheel.py --architecture "$(uname -m)" --deployment-target 13.0 wheelhouse/*.whl
      # Release gate: the built wheel must pass the installed-package
      # self-demo (native in-process kernel, no fallback exe) before anything
      # is published. Fails on golden-baseline drift.
      - name: Installed-wheel self-demo (release gate)
        shell: bash
        run: |
          python -m venv selfdemo_env
          if [ "$RUNNER_OS" = "Windows" ]; then VPY=selfdemo_env/Scripts/python; else VPY=selfdemo_env/bin/python; fi
          "$VPY" -m pip install --upgrade pip
          "$VPY" -m pip install --no-index --find-links wheelhouse taplite4mpo
          mkdir selfdemo_cwd && cd selfdemo_cwd
          "../$VPY" -m dtalite_qa self-demo --output selfdemo_artifacts

      - name: Upload self-demo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfdemo-release-${{ matrix.os }}
          path: selfdemo_cwd/selfdemo_artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  macos-wheel-smoke:
    name: macOS CPython 3.12 wheel smoke
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned macOS OpenMP runtime
        id: libomp
        uses: ./.github/actions/setup-macos-libomp
      - name: Build and test strict OpenMP wheel
        uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_BUILD: "cp312-macosx_*"
          CIBW_ARCHS_MACOS: "native"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=13.0 TAPLITE_REQUIRE_OPENMP=1 LIBOMP_PREFIX=${{ steps.libomp.outputs.prefix }}"
      - name: Inspect and verify repaired wheel
        run: |
          python -m pip install delocate
          delocate-listdeps wheelhouse/*.whl
          python scripts/verify_macos_wheel.py --architecture "$(uname -m)" --deployment-target 13.0 wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-pr-smoke
          path: ./wheelhouse/*.whl

  sdist:
    name: sdist
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi            # configure PyPI Trusted Publishing for this environment
    permissions:
      id-token: write            # OIDC: no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # re-runs after a partial publish must not hard-fail
